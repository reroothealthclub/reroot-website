<div class="team dk">
{{#each coaches}}
<article class="coach coach-{{nummer}}">
<img src="{{dit.foto}}" alt="{{dit.foto_alt}}" loading="lazy" decoding="async" class="cover" style="object-position:50% 14%">
<div class="coach-fade"></div>
<div class="coach-txt">
<span class="coach-tag">{{dit.focus}}</span>
<h3 class="disp coach-nm">{{dit.naam}}</h3>
<p>{{dit.bio}}</p>
</div>
</article>
{{/each}}
</div>
