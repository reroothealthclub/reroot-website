<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{#if pagina.is_404}}<base href="{{publicatie.basis_pad}}">
{{/if}}<title>{{pagina.titel}}</title>
<meta name="description" content="{{pagina.beschrijving}}">
<meta name="theme-color" content="#0F1614">
{{#if pagina.indexeren}}<link rel="canonical" href="{{pagina.url}}">{{else}}<meta name="robots" content="noindex, nofollow">{{/if}}
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="nl_BE">
<meta property="og:site_name" content="{{bedrijf.naam}}">
<meta property="og:title" content="{{pagina.titel}}">
<meta property="og:description" content="{{pagina.beschrijving}}">
<meta property="og:url" content="{{pagina.url}}">
<meta property="og:image" content="{{publicatie.deelbeeld_url}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="De trainingsruimte van Reroot Health Club in {{adres.gemeente}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Gloock&display=swap">
<link rel="stylesheet" href="stijl.css?v={{versie.css}}">
{{#if pagina.ld}}<script type="application/ld+json">{{{pagina.ld}}}</script>
{{/if}}</head>
<body>
<a class="skip" href="#main">Naar de inhoud</a>
<main id="main">
{{{inhoud}}}
</main>
<script src="site.js?v={{versie.js}}" defer></script>
</body>
</html>
