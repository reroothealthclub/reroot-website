# Bouwt de site en zet ze online via GitHub Pages, telkens er iets naar 'main' gestuurd wordt.
name: Publiceer website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Controleer en bouw
        run: |
          python3 test_site.py
          python3 bouw.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publiek

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
